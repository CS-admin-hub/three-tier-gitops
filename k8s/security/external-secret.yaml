# k8s_manifests/security/external-secret.yaml
# Pulls MongoDB credentials from AWS Secrets Manager into a K8s Secret automatically
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: workshop
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: workshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: mongodb-secret
    creationPolicy: Owner
  data:
    # Full MongoDB URI (kept for backend compatibility)
    - secretKey: MONGO_URI
      remoteRef:
        key: prod/three-tier/mongodb
        property: uri
    - secretKey: MONGO_USERNAME
      # Individual credentials for MongoDB initialization

      remoteRef:
        key: prod/three-tier/mongodb
        property: username
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: prod/three-tier/mongodb
        property: password
    - secretKey: MONGO_DATABASE
      remoteRef:
        key: prod/three-tier/mongodb
        property: database

