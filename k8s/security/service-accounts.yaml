# k8s_manifests/security/service-accounts.yaml
# NOTE: Replace 851725602228 with your actual AWS Account ID before applying
apiVersion: v1
# Backend pod gets AWS credentials to read from Secrets Manager

kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: workshop
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851725602228:role/BackendIRSARole

# External Secrets Operator uses this to pull secrets from Secrets Manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: workshop
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851725602228:role/ExternalSecretsRole
