apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster
  role: KarpenterNodeRole-three-tier-cluster
  blockDeviceMappings:
    - deviceName: /stage/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true
