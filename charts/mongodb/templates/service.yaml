# k8s_manifests/mongo/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: workshop
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  clusterIP: None # Headless service - required for StatefulSet stable DNS
