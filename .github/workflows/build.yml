name: Build and Push to ECR + GitOps Update

on:
  push:
    branches:
      - stage
      # - main   # enable after testing

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: 851725602228

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ======================
      # CHECKOUT CODE
      # ======================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ======================
      # AWS AUTH (OIDC)
      # ======================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725602228:role/GitHubApp-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ======================
      # ECR LOGIN
      # ======================
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ======================
      # SET IMAGE TAG
      # ======================
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ======================
      # FRONTEND BUILD & PUSH
      # ======================
      - name: Build Frontend
        run: docker build -t frontend:${IMAGE_TAG} ./frontend

      - name: Tag Frontend
        run: |
          docker tag frontend:${IMAGE_TAG} \
          ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-frontend:${IMAGE_TAG}

      - name: Push Frontend
        run: |
          docker push ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-frontend:${IMAGE_TAG}

      # ======================
      # BACKEND BUILD & PUSH
      # ======================
      - name: Build Backend
        run: docker build -t backend:${IMAGE_TAG} ./backend

      - name: Tag Backend
        run: |
          docker tag backend:${IMAGE_TAG} \
          ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-backend:${IMAGE_TAG}

      - name: Push Backend
        run: |
          docker push ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-backend:${IMAGE_TAG}

      # ======================
      # UPDATE GITOPS REPO
      # ======================
      - name: Clone GitOps Repo
        run: |
          git clone --branch stage https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/CS-admin-hub/three-tier-gitops.git
          echo "=== VERIFY CLONE ==="
          ls -R three-tier-gitops

      - name: Update Image Tag in Values Files
        run: |
          cd three-tier-gitops

          echo "=== INSTALLING YQ ==="
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq

          echo "Using IMAGE_TAG: $IMAGE_TAG"

          echo "=== UPDATING FRONTEND ==="
          if [ -f environments/stage/frontend-values.yaml ]; then
            CURRENT_TAG=$(./yq eval '.image.tag' environments/stage/frontend-values.yaml)
            echo "Current frontend tag: $CURRENT_TAG"

            ./yq eval ".image.tag = \"$IMAGE_TAG\"" -i environments/stage/frontend-values.yaml

            NEW_TAG=$(./yq eval '.image.tag' environments/stage/frontend-values.yaml)
            echo "New frontend tag: $NEW_TAG"
          else
            echo " Frontend file not found"
            ls -la environments/stage/
          fi

          echo "=== UPDATING BACKEND ==="
          if [ -f environments/stage/backend-values.yaml ]; then
            CURRENT_TAG=$(./yq eval '.image.tag' environments/stage/backend-values.yaml)
            echo "Current backend tag: $CURRENT_TAG"

            ./yq eval ".image.tag = \"$IMAGE_TAG\"" -i environments/stage/backend-values.yaml

            NEW_TAG=$(./yq eval '.image.tag' environments/stage/backend-values.yaml)
            echo "New backend tag: $NEW_TAG"
          else
            echo " Backend file not found"
            ls -la environments/stage/
          fi

          echo "=== FINAL VERIFICATION ==="
          echo "--- Frontend values ---"
          cat environments/stage/frontend-values.yaml
          echo "--- Backend values ---"
          cat environments/stage/backend-values.yaml

      #   - name: Update Image Tag in Values Files
    #     run: |
    #       cd three-tier-gitops

    #       #   sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" environments/dev/frontend-values.yaml
    #       #   sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" environments/dev/backend-values.yaml
    #       echo " === DEBUG: LIST FILES ==="
    #       ls -R

    #       echo "=== UPDATING FILES ==="
    #       #   sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" environments/dev/frontend-values.yaml || echo "frontend file not found"
    #       #   sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" environments/dev/backend-values.yaml || echo "backend file not found"
    #       sed -i "s|^\s*tag:.*|  tag: ${IMAGE_TAG}|" environments/dev/frontend-values.yaml
    #       sed -i "s|^\s*tag:.*|  tag: ${IMAGE_TAG}|" environments/dev/backend-values.yaml

    #       echo "=== VERIFY CHANGES ==="
    #       cat environments/dev/frontend-values.yaml
    #       cat environments/dev/backend-values.yaml

      - name: Commit and Push Changes
        run: |
          cd three-tier-gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update image tag to ${IMAGE_TAG}" || echo "No changes to commit"
          git push
